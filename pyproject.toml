[project]
name = "opencode-sess-sync"
version = "0.1.0"
description = "Sync OpenCode sessions between local and remote instances"
readme = "README.md"
authors = [
    { name = "Ferdinand Mütsch", email = "ferdinand@muetsch.io" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
]

[tool.uv]
package = false

[tool.ruff]
indent-width = 4
line-length = 240
target-version = "py314"
extend-exclude = ["**/migrations", "**/.*"]

[tool.ruff.lint]
select = ["I", "F401"]  # sort imports and remove unused
ignore = ["F403"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
